name: build-firmware

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install arduino-cli
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh -s
          echo "$PWD/bin" >> $GITHUB_PATH

      - name: Install ESP32 core 2.0.13
        run: |
          arduino-cli config init
          arduino-cli config set board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.13

      - name: Install libraries
        run: |
          arduino-cli lib install "LovyanGFX@1.2.28"
          arduino-cli lib install "WiFiManager@2.0.17"

      - name: Arrange sketch folder
        run: |
          mkdir -p sketch/obd_dash
          cp obd_dash.ino sketch/obd_dash/
          cp *.h sketch/obd_dash/

      - name: Compile
        run: |
          mkdir -p out
          SEMVER="$(tr -d '[:space:]' < VERSION)"
          REV="${GITHUB_SHA::7}"
          echo "firmware v$SEMVER rev $REV"
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32c3:CDCOnBoot=cdc,PartitionScheme=min_spiffs,FlashMode=dio,FlashFreq=80,FlashSize=4M,UploadSpeed=921600,CPUFreq=160" \
            --build-property "compiler.cpp.extra_flags=-DFW_VER=\"$SEMVER\" -DFW_REV=\"$REV\"" \
            --output-dir out \
            sketch/obd_dash

      - name: Prepare artifacts
        id: art
        run: |
          SEMVER="$(tr -d '[:space:]' < VERSION)"
          cp out/*.ino.bin firmware.bin
          md5sum firmware.bin | awk '{print $1}' > firmware.md5
          echo "semver=$SEMVER" >> "$GITHUB_OUTPUT"
          echo "--- firmware.bin ---"; ls -la firmware.bin
          echo "--- md5 ---"; cat firmware.md5

      - name: Publish to 'latest' release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "OBD Dash firmware v${{ steps.art.outputs.semver }}"
          body: "v${{ steps.art.outputs.semver }} — ${{ github.sha }}"
          files: |
            firmware.bin
            firmware.md5
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
